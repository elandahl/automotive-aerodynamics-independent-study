<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Free-body diagram of a car at rest</title>
  <rect width="720" height="420" fill="#fbfaf7"/>
  <text x="360" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#1f2a37">FBD 1 - car at rest (no aero)</text>

  <line x1="60" y1="300" x2="660" y2="300" stroke="#6b7280" stroke-width="6"/>
  <line x1="60" y1="308" x2="660" y2="308" stroke="#d1d5db" stroke-width="2"/>

  <g transform="translate(160,178)">
    <rect x="20" y="52" width="340" height="58" rx="14" fill="#1f3a5f"/>
    <path d="M70 52 L110 8 H250 L310 52 Z" fill="#2b4d73"/>
    <rect x="122" y="16" width="70" height="34" rx="4" fill="#c5d6ea"/>
    <rect x="200" y="16" width="48" height="34" rx="4" fill="#c5d6ea"/>
    <circle cx="90" cy="118" r="28" fill="#111827" stroke="#9ca3af" stroke-width="6"/>
    <circle cx="90" cy="118" r="10" fill="#e5e7eb"/>
    <circle cx="300" cy="118" r="28" fill="#111827" stroke="#9ca3af" stroke-width="6"/>
    <circle cx="300" cy="118" r="10" fill="#e5e7eb"/>
  </g>

  <g stroke="#1d4ed8" stroke-width="8" fill="#1d4ed8" stroke-linecap="round">
    <line x1="360" y1="290" x2="360" y2="118"/>
    <polygon points="360,96 348,122 372,122"/>
  </g>
  <text x="378" y="150" font-family="Georgia, serif" font-size="26" fill="#1d4ed8">N</text>

  <g stroke="#b91c1c" stroke-width="8" fill="#b91c1c" stroke-linecap="round">
    <line x1="250" y1="178" x2="250" y2="250"/>
    <polygon points="250,272 238,246 262,246"/>
  </g>
  <text x="198" y="232" font-family="Georgia, serif" font-size="26" fill="#b91c1c">mg</text>

  <text x="360" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#374151">Level road, a = 0,  N - mg = 0</text>
  <text x="360" y="388" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#6b7280">Rest is a = 0. Do not omit the force arrows.</text>
</svg>
