<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img">
  <title>Free-body diagram of a car in steady cruise with aerodynamic forces</title>
  <rect width="860" height="460" fill="#fbfaf7"/>
  <text x="430" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#1f2a37">FBD 2 - steady cruise with aero</text>

  <g stroke="#93c5fd" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M80 92 H170"/>
    <path d="M80 112 H150"/>
    <path d="M80 132 H160"/>
    <polygon points="170,92 158,86 158,98" fill="#93c5fd" stroke="none"/>
    <polygon points="150,112 138,106 138,118" fill="#93c5fd" stroke="none"/>
    <polygon points="160,132 148,126 148,138" fill="#93c5fd" stroke="none"/>
  </g>
  <text x="80" y="78" font-family="system-ui, sans-serif" font-size="14" fill="#2563eb">airflow</text>

  <line x1="70" y1="318" x2="790" y2="318" stroke="#6b7280" stroke-width="6"/>
  <line x1="70" y1="326" x2="790" y2="326" stroke="#d1d5db" stroke-width="2"/>

  <g transform="translate(230,196)">
    <rect x="20" y="52" width="340" height="58" rx="14" fill="#1f3a5f"/>
    <path d="M70 52 L110 8 H250 L310 52 Z" fill="#2b4d73"/>
    <rect x="122" y="16" width="70" height="34" rx="4" fill="#c5d6ea"/>
    <rect x="200" y="16" width="48" height="34" rx="4" fill="#c5d6ea"/>
    <rect x="330" y="18" width="54" height="8" rx="2" fill="#111827"/>
    <rect x="372" y="18" width="6" height="40" fill="#111827"/>
    <circle cx="90" cy="118" r="28" fill="#111827" stroke="#9ca3af" stroke-width="6"/>
    <circle cx="90" cy="118" r="10" fill="#e5e7eb"/>
    <circle cx="300" cy="118" r="28" fill="#111827" stroke="#9ca3af" stroke-width="6"/>
    <circle cx="300" cy="118" r="10" fill="#e5e7eb"/>
  </g>

  <g stroke="#1d4ed8" stroke-width="8" fill="#1d4ed8" stroke-linecap="round">
    <line x1="430" y1="308" x2="430" y2="86"/>
    <polygon points="430,64 418,90 442,90"/>
  </g>
  <text x="448" y="108" font-family="Georgia, serif" font-size="22" fill="#1d4ed8">N = mg + Dw</text>

  <g stroke="#b91c1c" stroke-width="8" fill="#b91c1c" stroke-linecap="round">
    <line x1="330" y1="196" x2="330" y2="268"/>
    <polygon points="330,290 318,264 342,264"/>
  </g>
  <text x="278" y="250" font-family="Georgia, serif" font-size="24" fill="#b91c1c">mg</text>

  <g stroke="#7c3aed" stroke-width="8" fill="#7c3aed" stroke-linecap="round">
    <line x1="520" y1="196" x2="520" y2="268"/>
    <polygon points="520,290 508,264 532,264"/>
  </g>
  <text x="536" y="250" font-family="Georgia, serif" font-size="24" fill="#7c3aed">Dw</text>

  <g stroke="#c2410c" stroke-width="8" fill="#c2410c" stroke-linecap="round">
    <line x1="230" y1="248" x2="130" y2="248"/>
    <polygon points="108,248 134,236 134,260"/>
  </g>
  <text x="128" y="228" font-family="Georgia, serif" font-size="24" fill="#c2410c">FD</text>

  <g stroke="#15803d" stroke-width="8" fill="#15803d" stroke-linecap="round">
    <line x1="610" y1="248" x2="720" y2="248"/>
    <polygon points="742,248 716,236 716,260"/>
  </g>
  <text x="628" y="228" font-family="Georgia, serif" font-size="20" fill="#15803d">Fdrive</text>

  <text x="430" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#374151">Constant velocity: net Fx = 0 and net Fy = 0</text>
</svg>
